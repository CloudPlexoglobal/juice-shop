AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Cyber Sheriff demo Juice Shop at juice.cybersheriff.ai - deliberately vulnerable, so it is fenced
  off: its own subnets and route table (in a shared VPC), its own load balancer, a container only that load balancer can reach, outbound
  HTTPS only (to pull its image), and no IAM task role, so nothing in it can obtain AWS credentials.
  Deployed by .github/workflows/cybersheriff-deploy.yml through the bootstrap's CloudFormation role.

Parameters:
  # The account is at its VPC quota, so the demo lives in aws-default-vpc (the least-used VPC)
  # in subnets and a route table of its own; the security groups below do the fencing.
  VpcId:
    Type: AWS::EC2::VPC::Id
    Default: vpc-039a40981013b2835
  InternetGatewayId:
    Type: String
    Default: igw-0604704f4ca82e92b
  ImageUri:
    Type: String
    Description: The Juice Shop image the workflow built from this branch.
  CertificateArn:
    Type: String
    Default: arn:aws:acm:eu-west-1:276023487603:certificate/e7fc050e-5677-4bf0-a6ff-1e980975d981
    Description: The *.cybersheriff.ai certificate.
  Cpu:
    Type: String
    Default: '1024'
    Description: A 0.5 vCPU Juice Shop fell over under sqlmap's time-based payloads.
  Memory:
    Type: String
    Default: '2048'

Resources:
  # ------------------------------------------------------------------ its own subnets
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VpcId
      Tags: [{ Key: Name, Value: juice-shop-demo }]
  DefaultRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGatewayId

  SubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VpcId
      CidrBlock: 10.0.200.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: juice-shop-demo-a }]
  SubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VpcId
      CidrBlock: 10.0.201.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: juice-shop-demo-b }]
  SubnetARoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref SubnetA, RouteTableId: !Ref PublicRouteTable }
  SubnetBRoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref SubnetB, RouteTableId: !Ref PublicRouteTable }

  # ------------------------------------------------------------------ who may talk to whom
  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: juice-shop-demo load balancer - HTTP(S) from anywhere
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0 }
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0 }

  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: juice-shop-demo task - only the load balancer in, only HTTPS out
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup
      SecurityGroupEgress:
        # Pulling the image needs HTTPS out; nothing else does.
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0 }

  LoadBalancerToTask:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref LoadBalancerSecurityGroup
      IpProtocol: tcp
      FromPort: 3000
      ToPort: 3000
      DestinationSecurityGroupId: !Ref TaskSecurityGroup

  # ------------------------------------------------------------------ the load balancer
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: juice-shop-demo
      Scheme: internet-facing
      Subnets: [!Ref SubnetA, !Ref SubnetB]
      SecurityGroups: [!Ref LoadBalancerSecurityGroup]

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: juice-shop-demo
      VpcId: !Ref VpcId
      Port: 3000
      Protocol: HTTP
      TargetType: ip
      HealthCheckPath: /
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 5
      Matcher: { HttpCode: '200' }
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: '10' }

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates: [{ CertificateArn: !Ref CertificateArn }]
      DefaultActions:
        - { Type: forward, TargetGroupArn: !Ref TargetGroup }

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig: { Protocol: HTTPS, Port: '443', StatusCode: HTTP_301 }

  # ------------------------------------------------------------------ the container
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/ecs/juice-shop-demo
      RetentionInDays: 7

  # Pulls the image and writes logs. There is deliberately no task role.
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: juice-shop-demo-execution
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: juice-shop-demo

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: juice-shop-demo
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref Cpu
      Memory: !Ref Memory
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      ContainerDefinitions:
        - Name: juice-shop
          Image: !Ref ImageUri
          Essential: true
          PortMappings: [{ ContainerPort: 3000, Protocol: tcp }]
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: juice-shop

  Service:
    Type: AWS::ECS::Service
    DependsOn: HttpsListener
    Properties:
      ServiceName: juice-shop-demo
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      DesiredCount: 1
      TaskDefinition: !Ref TaskDefinition
      HealthCheckGracePeriodSeconds: 120
      DeploymentConfiguration:
        MinimumHealthyPercent: 0
        MaximumPercent: 100
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: [!Ref SubnetA, !Ref SubnetB]
          SecurityGroups: [!Ref TaskSecurityGroup]
      LoadBalancers:
        - { ContainerName: juice-shop, ContainerPort: 3000, TargetGroupArn: !Ref TargetGroup }

Outputs:
  LoadBalancerDnsName:
    Description: Point juice.cybersheriff.ai here (CNAME).
    Value: !GetAtt LoadBalancer.DNSName
